version: 2

seeds:
  - name: fx_rates_annual
    description: >
      Exchange rates used to convert spend into the reporting currency (EUR).
      **Grain: one row per currency_code per rate_year.** Rate = units of
      currency per 1 EUR (ECB convention), so `spend_eur = spend_local / units_per_eur`.

      Why a seed: it is small, slow-changing reference data that must be
      versioned and code-reviewed. A rate change should go through a pull request.

      Known simplification: annual averages. Production should load daily ECB
      reference rates into bronze and join on date. The model already joins on a
      period key, so only this table would change.

      A currency/year combination with no row here does NOT silently produce NULL
      spend. The `assert_all_spend_converted_to_eur` test fails the build.
    config:
      column_types:
        currency_code: string
        rate_year: int
        units_per_eur: decimal(18, 6)
        rate_source: string
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [currency_code, rate_year]
    columns:
      - name: currency_code
        description: ISO-4217 code.
        data_tests: [not_null]
      - name: rate_year
        description: Calendar year the average applies to.
        data_tests: [not_null]
      - name: units_per_eur
        description: Units of currency_code per 1 EUR (e.g. USD 1.13 means 1 EUR = 1.13 USD).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: rate_source
        description: Provenance of the rate, for auditability.
