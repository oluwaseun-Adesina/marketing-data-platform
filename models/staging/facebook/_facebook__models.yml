version: 2

models:
  - name: stg_facebook__ad_stats
    description: >
      Typed, deduplicated Facebook daily ad performance.
      **Grain: one row per ad_id per date_day.** Metrics keep the source's NULLs.
      Spend is in the ad account's currency (see stg_facebook__accounts.currency_code).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ad_id, date_day]
    columns:
      - name: ad_id
        description: Facebook ad id (string identifier).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_facebook__ads')
                field: ad_id
      - name: account_id
        description: Owning ad account. Drives the spend currency.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_facebook__accounts')
                field: account_id
      - name: date_day
        description: Performance date.
        data_tests: [not_null]
      - name: spend
        description: Spend in account currency. Never NULL in this source.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: impressions
        description: Impressions. NULL means the source sent "null" (treated as 0 downstream).
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: clicks
        description: Link + other clicks. NULL means the source sent "null" (treated as 0 downstream).
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= impressions"
              config:
                where: "impressions is not null"
                severity: warn
      - name: _ingested_at
        description: Load timestamp of the winning (latest) source row.

  - name: stg_facebook__ads
    description: "Facebook ads (creatives). **Grain: one row per ad_id**, latest version."
    columns:
      - name: ad_id
        data_tests: [unique, not_null]
      - name: campaign_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_facebook__campaigns')
                field: campaign_id
      - name: ad_group_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_facebook__ad_groups')
                field: ad_group_id
      - name: account_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_facebook__accounts')
                field: account_id
      - name: ad_status
        description: Delivery status at export time.
        data_tests:
          - accepted_values:
              arguments:
                values: [ACTIVE, PAUSED, ARCHIVED, DELETED]
              config: {severity: warn}

  - name: stg_facebook__ad_groups
    description: "Facebook ad sets. **Grain: one row per ad_group_id**, latest version."
    columns:
      - name: ad_group_id
        data_tests: [unique, not_null]

  - name: stg_facebook__campaigns
    description: "Facebook campaigns. **Grain: one row per campaign_id**, latest version."
    columns:
      - name: campaign_id
        data_tests: [unique, not_null]
      - name: campaign_name
        data_tests: [not_null]

  - name: stg_facebook__accounts
    description: "Facebook ad accounts. **Grain: one row per account_id**, latest version."
    columns:
      - name: account_id
        data_tests: [unique, not_null]
      - name: currency_code
        description: ISO-4217 billing currency of the account. All spend for the account is in this currency.
        data_tests:
          - not_null
          - relationships:   # every currency must have an FX rate, or reporting-currency spend would silently go NULL
              arguments:
                to: ref('fx_rates_annual')
                field: currency_code
