version: 2

sources:
  - name: snapchat_ads
    description: >
      Raw Snapchat Ads exports, loaded unchanged into Unity Catalog by
      `databricks/01_bronze_load.sql`. Dimension tables are *history* exports
      and can hold several versions of the same id.
    database: "{{ env_var('DBT_RAW_CATALOG', 'mkt_raw') }}"
    schema: snapchat_ads
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 26, period: hour}
        error_after: {count: 72, period: hour}
    tables:
      - name: ad_stats
        description: >
          Daily ad performance broken down by COUNTRY. One row per ad per day per
          country (verified: 2,809 rows but only 1,052 distinct ad/day pairs).
          Spend is in real currency units (e.g. 48.174024 EUR), not micro-currency.
        columns:
          - name: ad_detail_id
            description: Snapchat ad id (UUID). Joins to ads.ad_id.
            data_tests: [not_null]
          - name: ad_currency_code
            description: Currency of ad_spend, given per row.
          - name: ad_country
            description: Lower-case ISO-3166 alpha-2 country of delivery.
          - name: ad_spend
            description: Spend, up to 6 decimals.
          - name: ad_clicks
            description: Clicks. The text "null" means none recorded.
          - name: data_src
            description: Constant 'snapchat_ads' tag from the upstream extractor.
        data_tests:
          - elementary.schema_changes:
              config: {severity: warn}
          - elementary.volume_anomalies:
              config: {severity: warn}

      - name: ads
        description: Snapchat ads (history export).
        config:
          freshness: null
        columns:
          - name: ad_id
            data_tests: [not_null]
      - name: ad_groups
        description: >
          Snapchat ad squads (history export). CONTAINS DUPLICATE ad_group_ids
          (several versions with different ad_group_updated_at). Must be
          deduplicated before joining, or spend fans out.
        config:
          freshness: null
      - name: campaigns
        description: Snapchat campaigns, with account_id. No account table is provided for Snapchat.
        config:
          freshness: null
