# Drop the PR's CI schemas when the pull request is merged or closed, so the CI
# catalog does not fill up with stale tables (cost + clutter).
name: CI teardown

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

env:
  DBT_PROFILES_DIR: .
  DBT_TARGET: ci
  DBT_CI_SCHEMA: pr_${{ github.event.pull_request.number }}
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DBX_CI_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DBX_CI_CLIENT_SECRET }}

jobs:
  drop-schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: dbt deps
      - name: Drop mkt_ci.pr_<n>_* schemas
        run: dbt run-operation drop_ci_schemas --target ci --args "{prefix: pr_${{ github.event.pull_request.number }}}"
